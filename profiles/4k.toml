name = "Stellaris UI Scaler 4K"
mod_version = "0.1.0"
source_mods = []
resolution = [
    3840,
    2160,
]
scale = 2.0
font_scale = 1.9
reproduction = false
auto_algorithm = true
auto_sharpening = true

[fonts.hoi_16mbs]
replace_bitmap = false

[textures]
algorithm = "lanczos3"
color_space = "srgb"
premultiplied_alpha = true
independent_frames = true
sharpening = 0.45
sharpening_radius = 1.0
sharpening_threshold = 2

[outliner]
compact = false
width = 600
row_height = 30
title_height = 40

[categories.icon]
algorithm = "catmull_rom"
color_space = "srgb"
premultiplied_alpha = true
independent_frames = true
sharpening = 0.45


name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  format:
    name: Formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Rust from rust-toolchain.toml
        run: |
          rustup show
          rustup component add rustfmt
      - run: cargo fmt --all -- --check

  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - name: Clippy (GUI and CLI)
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Tests (GUI and CLI)
        run: cargo test --locked --all-features
      - name: Clippy (CLI only)
        run: cargo clippy --locked --all-targets --no-default-features -- -D warnings
      - name: Tests (CLI only)
        run: cargo test --locked --no-default-features
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Prepare neural upscaling resources
        run: |
          python -m pip install -r tools/requirements-ai.txt
          python tools/prepare_ai.py
      - name: RealPLKSR inference and pipeline tests
        run: cargo test --locked --all-features realplksr -- --ignored

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  version:
    name: Check release version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Match tag to Cargo.toml
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path('Cargo.toml').read_text())['package']['version']
          tag = os.environ['RELEASE_TAG']
          if tag != f'v{version}':
              raise SystemExit(f'Release tag {tag!r} must match Cargo.toml version v{version}')
          PY

  checks:
    needs: version
    uses: ./.github/workflows/ci.yml

  build:
    name: Build (${{ matrix.target }})
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            binary: stellaris-ui-scaler
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            binary: stellaris-ui-scaler.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      TARGET: ${{ matrix.target }}
      BINARY: ${{ matrix.binary }}
      PACKAGE: stellaris-ui-scaler-${{ github.ref_name }}-${{ matrix.target }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - name: Install target
        run: rustup target add "$TARGET"
      - name: Build GUI and CLI
        run: cargo build --locked --release --all-features --target "$TARGET"
      - name: Smoke test
        run: |
          "target/$TARGET/release/$BINARY" --version
          "target/$TARGET/release/$BINARY" --help
      - name: Prepare package
        run: |
          mkdir -p "dist/$PACKAGE/licenses"
          cp "target/$TARGET/release/$BINARY" README.md "dist/$PACKAGE/"
          cp -R profiles "dist/$PACKAGE/"
          cp assets/icons/LICENSE "dist/$PACKAGE/licenses/tabler-icons-LICENSE"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Package RealPLKSR model and runtime
        run: |
          python -m pip install -r tools/requirements-ai.txt
          python tools/prepare_ai.py --output "dist/$PACKAGE/ai"
      - name: Package Linux AppImage
        if: runner.os == 'Linux'
        env:
          ARCH: x86_64
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          appdir="$RUNNER_TEMP/stellaris-ui-scaler.AppDir"
          cp -R "dist/$PACKAGE" "$appdir"
          cp packaging/appimage/AppRun packaging/appimage/stellaris-ui-scaler.desktop "$appdir/"
          cp assets/icons/aperture.svg "$appdir/stellaris-ui-scaler.svg"
          chmod +x "$appdir/AppRun"
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 120 \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage \
            --output "$RUNNER_TEMP/appimagetool.AppImage"
          chmod +x "$RUNNER_TEMP/appimagetool.AppImage"
          "$RUNNER_TEMP/appimagetool.AppImage" "$appdir" "dist/$PACKAGE.AppImage"
          "dist/$PACKAGE.AppImage" --version
          "dist/$PACKAGE.AppImage" --help
      - name: Archive Linux package
        if: runner.os == 'Linux'
        run: tar -czf "dist/$PACKAGE.tar.gz" -C dist "$PACKAGE"
      - name: Archive Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/$env:PACKAGE" -DestinationPath "dist/$env:PACKAGE.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.AppImage
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Generate checksums
        working-directory: dist
        run: sha256sum *.tar.gz *.zip *.AppImage > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            flags=()
            if [[ "$RELEASE_TAG" == *-* ]]; then
              flags+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" dist/* \
              --verify-tag --generate-notes --title "$RELEASE_TAG" "${flags[@]}"
          fi

cargo-features = ["profile-rustflags"]

[package]
name = "stellaris-ui-scaler"
version = "0.1.3"
edition = "2024"
publish = false
description = "Compile and compare scaled Stellaris user interfaces"
keywords = ["stellaris", "modding", "ui", "scaling"]
categories = ["command-line-utilities", "multimedia::images"]
authors = ["hexqnt <hexqntlab@gmail.com>"]


[features]
default = ["gui"]
gui = ["dep:eframe", "dep:egui_extras", "dep:egui-file-dialog", "dep:nucleo-matcher"]

[dependencies]
anyhow = "1.0.104"
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive"] }
eframe = { version = "0.37.0", optional = true, default-features = false, features = [
    "glow",
    "clipboard",
    "x11",
    "wayland",
    "default_fonts",
    "inspection",
] }
image = { version = "0.25.10", default-features = false, features = [
    "png",
    "dds",
    "tga",
    "jpeg",
    "bmp",
] }
egui_extras = { version = "0.37.0", optional = true, default-features = false, features = [
    "svg",
] }
image_dds = { version = "0.7.2", default-features = false, features = [
    "ddsfile",
    "image",
] }
nucleo-matcher = { version = "0.3.1", optional = true }
ort = { version = "=2.0.0-rc.15", default-features = false, features = [
    "std",
    "load-dynamic",
    "api-31",
] }
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
toml = "1.2.0"
zip = { version = "9.3.0", default-features = false, features = ["deflate"] }
egui-file-dialog = { version = "0.16.0", optional = true }

[profile.release]
strip = true
panic = "abort"
lto = true
codegen-units = 1
opt-level = 3
rustflags = ["-Ctarget-cpu=x86-64-v3", "-Ctarget-feature=+avx2,+fma"]

[profile.profiling]
inherits = "release"
debug = true
strip = false

[[bench]]
name = "resample"
harness = false

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

# Транзитивные версии определяются графом eframe и декодеров.
multiple_crate_versions = "allow"
# Пакет не публикуется; репозиторий и общая лицензия ещё не заданы владельцем.
cargo_common_metadata = "allow"
